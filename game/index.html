<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STARFALL: CONSTELLATION BREAKER — Neon Arcade Space Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #050514; overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #eaf6ff; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 700px at 50% 20%, #141b4d 0%, #050514 60%, #02020a 100%); }
  canvas { display: block; width: min(96vw, 960px, calc(92vh * 1.5)); aspect-ratio: 960 / 640; height: auto;
    border-radius: 14px; box-shadow: 0 0 0 1px #2b3a7a, 0 0 44px rgba(0,229,255,.25), 0 0 90px rgba(255,0,153,.12);
    background: #050514; cursor: crosshair; }
  #hint { position: fixed; left: 0; right: 0; bottom: 10px; text-align: center;
    font-size: 12px; letter-spacing: .08em; color: #7f8fc9; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="640"></canvas></div>
<div id="hint">STARFALL — ARROWS / WASD — FLY &nbsp;·&nbsp; SPACE / CLICK — SHOOT &nbsp;·&nbsp; P — PAUSE &nbsp;·&nbsp; M — SOUND &nbsp;·&nbsp; G — REDUCED EFFECTS &nbsp;·&nbsp; R — RESTART &nbsp;·&nbsp; GAME OVER? PRESS R TO FLY AGAIN</div>
<script src="src/audio.js" defer></script>
<script src="src/constellation.js" defer></script>
<script src="src/upgrades.js" defer></script>
<script src="src/input.js" defer></script>
<script src="src/enemies.js" defer></script>
<script src="src/boss.js" defer></script>
<script src="src/render.js" defer></script>
<script src="src/main.js" defer></script>
</body>
</html>
