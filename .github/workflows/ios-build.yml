# Starfall — unsigned iOS build (Capacitor 8, no signing).
#
# Produces an UNSIGNED .ipa (CODE_SIGNING_ALLOWED=NO) for sideloading /
# inspection only. No Apple Developer Program enrolment, no certificates,
# no provisioning profiles, no signing identities are used anywhere.
# The .ipa is uploaded as a build artifact; nothing is submitted to Apple.
#
# Icon + splash PNGs are NOT committed (binary files cannot be pushed via
# the GitHub connector). They are generated on the runner from the text
# sources assets/icon.svg and assets/splash.svg by @capacitor/assets
# before xcodebuild runs.

name: iOS build (unsigned)

on:
  push:
    branches:
      - main
    paths:
      - "game/**"
      - "ios/**"
      - "capacitor.config.json"
      - "package*.json"
      - ".github/workflows/ios-build.yml"
      - "assets/**"
  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned iOS .ipa
    # macos-26 (runs 44536181692, 44541703200) and macos-15 (run
    # 44544588142) all sat queued ~15 min then cancelled, no step ran:
    # "job was not acquired by Runner of type hosted" — GitHub-wide
    # macOS arm64 capacity problem, Nov 2026. macos-15-intel is a
    # separate Intel pool (4 CPU, 14 GB), not the arm64 pool; an Intel
    # Mac still builds an arm64 iOS target with Xcode 16, which
    # satisfies Capacitor 8 (needs Xcode 15+). Unsigned test .ipa only —
    # App Store uploads later need Xcode 26+ per Apple (28 Apr 2026).
    runs-on: macos-15-intel
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS project
        # Copies game/ into ios/App/App/public and updates the Swift
        # Package Manager plugin list (Capacitor 8 uses SPM, not CocoaPods,
        # so there is no `pod install` step).
        run: npx cap sync ios

      - name: Generate icon + splash PNGs from SVG sources
        run: npx @capacitor/assets generate --ios

      - name: Xcode version (sanity log)
        run: xcodebuild -version

      - name: Build unsigned archive
        run: >
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -allowProvisioningUpdates=false
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGN_IDENTITY=""
          archive
          -archivePath build/Starfall.xcarchive

      - name: Package .app as unsigned .ipa
        # The scheme builds App.app (PRODUCT_NAME = $(TARGET_NAME), target "App").
        run: |
          ls build/Starfall.xcarchive/Products/Applications/
          mkdir -p Payload
          cp -r build/Starfall.xcarchive/Products/Applications/App.app Payload/
          zip -r Starfall-unsigned.ipa Payload

      - name: Report .ipa size
        run: |
          du -h Starfall-unsigned.ipa
          ls -lh Starfall-unsigned.ipa

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: starfall-unsigned-ipa
          path: Starfall-unsigned.ipa
          if-no-files-found: error
